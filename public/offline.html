<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus — MUA Manager</title>
    <meta name="theme-color" content="#ec4899">
    <link rel="icon" type="image/png" href="/lip-matt.png">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,600,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'figtree', sans-serif;
        }
        body {
            background: linear-gradient(180deg, #fff7fb 0%, #ffffff 50%, #fff1f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.12);
            border: 1px solid rgba(244, 114, 182, 0.2);
        }
        .icon {
            width: 72px;
            height: 72px;
            background: #fdf2f8;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            border: 1px solid #fbcfe8;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background: #db2777;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.25);
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda sedang terputus. Pastikan data seluler atau Wi-Fi Anda aktif, lalu coba muat ulang halaman.</p>
        <button onclick="window.location.reload()" class="btn">Coba Muat Ulang</button>
    </div>
</body>
</html>
